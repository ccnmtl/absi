<div class="container my-2">
    <div class="row">
        <div class="main-controls p-2 border border-dark rounded">
            Say this word:

            <div class="text-center d-block mb-2">
                <div class="dabke-text fs-3">{{ pageblock.initial_first }}</div>
                <div class="dabke-ipa">{{ pageblock.initial_ipa_first }}</div>
            </div>

            <div class="text-center">
                <canvas class="visualizer inline" height="60"></canvas>

                <div id="buttons">
                    <button type="button" class="btn btn-bd-primary record">
                        <i class="bi bi-record"></i> Record
                    </button>
                    <button type="button" class="btn btn-secondary stop">
                        <i class="bi bi-stop"></i> Stop
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="d-grid gap-2">
    <button type="button" class="btn btn-bd-primary"
            id="dabke-review-next-button">
        Next: Review
    </button>
</div>
