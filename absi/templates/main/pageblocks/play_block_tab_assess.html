<p class="text-secondary">
    Your pronunciation of <span class="lang-ar">بَ</span>
    closely matches the example. Focus on keeping your lips
    fully together before the release.  Compare your recording
    to the example.
</p>

<div class="d-grid gap-2 m-2">
    {% with next_section=section.get_next %}
    {% if next_section %}
    <a role="button" class="btn btn-bd-primary"
       href="{{next_section.get_absolute_url}}">
        Next syllable
    </a>
    {% endif %}
    {% endwith %}
    <button type="button" class="btn btn-bd-secondary"
            id="dabke-listen-button">
        Try again
    </button>
</div>
