{% with children=section.get_children %}

<div class="list-group">
    {% for child in children %}
    <a href="{{ child.get_absolute_url }}"
       class="list-group-item list-group-item-action">
        <div dir="rtl" class="d-flex w-100 justify-content-between">
            <h3 class="mb-1 lang-ar">{{ child.label }}</h3>
        </div>
    </a>
    {% endfor %}
</div>

{% endwith %}
